<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark" class="dark-style" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>استعادة كلمة المرور | شركة وادي بناء للنقل الدولي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" id="bootstrapCss" />

  <script src="assets/vendor/js/helpers.js"></script>
  <script src="assets/vendor/js/template-customizer.js"></script>
  <script src="assets/js/config.js"></script>

  <style>
    :root {
      --bs-body-bg: #09090b;
      --bs-card-bg: #121215;
      --gold-primary: #D4AF37;
      --gold-dark: #AA8C2C;
      --border-gold: rgba(212, 175, 55, 0.25);
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top left, #1c1917 0%, #09090b 65%);
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background-color: var(--bs-card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      max-width: 430px;
      width: 100%;
    }
    .text-gold { color: var(--gold-primary) !important; }
    .btn-gold {
      background: linear-gradient(135deg, #D4AF37 0%, #AA8C2C 100%);
      color: #000;
      font-weight: 800;
      border: none;
    }
    .btn-gold:hover { opacity: 0.92; color: #000; }
  </style>
</head>
<body class="p-3">

  <div class="auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10 border border-warning mb-3" style="width: 72px; height: 72px;">
        <i class="fa-solid fa-key fa-2x text-gold"></i>
      </div>
      <h4 class="fw-black text-gold mb-1">استعادة كلمة المرور</h4>
      <p class="text-secondary small mb-0">أدخل اسم المستخدم ورقم واتساب المسجل في ملفك. ستراجع الإدارة الطلب وتتواصل معك على الرقم المسجل.</p>
    </div>

    <div id="forgetAlert" class="alert d-none py-2 small fw-bold text-center" role="alert"></div>

    <form id="forgetPasswordForm" onsubmit="handleForgetSubmit(event)">
      <div class="mb-3">
        <label for="forgetUsername" class="form-label small fw-bold">اسم المستخدم المسجل</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-gold"><i class="fa-solid fa-user-check"></i></span>
          <input type="text" id="forgetUsername" class="form-control bg-dark text-light border-secondary" placeholder="مثال: محمود أو اسم الموظف" required />
        </div>
      </div>

      <div class="mb-3">
        <label for="forgetPhone" class="form-label small fw-bold">رقم الهاتف / واتساب للتواصل</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-gold"><i class="fa-brands fa-whatsapp"></i></span>
          <input type="tel" id="forgetPhone" class="form-control bg-dark text-light border-secondary" placeholder="05XXXXXXXX" required />
        </div>
      </div>

      <button type="submit" id="btnForgetSubmit" class="btn btn-gold w-100 py-2 mb-3">
        <i class="fa-solid fa-paper-plane ms-1"></i> إرسال طلب استعادة كلمة المرور
      </button>

      <div class="d-grid gap-2">
        <a href="login.html" class="btn btn-outline-secondary btn-sm fw-bold">
          <i class="fa-solid fa-arrow-right ms-1"></i> العودة إلى صفحة تسجيل الدخول
        </a>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-50">
      <small class="text-secondary">للدعم الفني الفوري: الإدارة العامة - شركة وادي بناء للنقل الدولي</small>
    </div>
  </div>

  <script src="assets/vendor/libs/jquery/jquery.js"></script>
  <script src="assets/vendor/libs/bootstrap/bootstrap.js"></script>
  <script src="assets/vendor/libs/form-validation/FormValidation.min.js"></script>
  <script src="assets/vendor/libs/form-validation/Bootstrap5.min.js"></script>
  <script src="assets/vendor/libs/form-validation/AutoFocus.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const app = initializeApp(window.config.firebaseConfig);
    const rtdb = getDatabase(app);

    window.handleForgetSubmit = async function (e) {
      e.preventDefault();
      const username = document.getElementById('forgetUsername').value.trim();
      const phone = document.getElementById('forgetPhone').value.trim();
      const alertBox = document.getElementById('forgetAlert');
      const btn = document.getElementById('btnForgetSubmit');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm ms-1"></span> جاري إرسال الطلب...';

      try {
        const usersSnapshot = await get(ref(rtdb, 'users'));
        const users = usersSnapshot.val() || {};
        const normalizePhone = value => String(value || '').replace(/\D/g, '').replace(/^00/, '');
        const matched = Object.values(users).find(user =>
          String(user.username || '').trim().toLowerCase() === username.toLowerCase() &&
          user.active !== false && normalizePhone(user.phone) === normalizePhone(phone)
        );
        if (!matched || !phone) throw new Error('رقم الهاتف أو اسم المستخدم لا يطابق الملف المسجل.');
        await push(ref(rtdb, 'wadi_bana_system/password_reset_requests'), {
          username: matched.username,
          phone: matched.phone,
          userId: matched.uid || null,
          status: 'معلق',
          requestedAt: new Date().toISOString()
        });

        alertBox.className = 'alert alert-success py-2 small fw-bold text-center';
        alertBox.textContent = 'تم التحقق من الرقم وإرسال الطلب للإدارة. ستتواصل معك الإدارة عبر واتساب بعد مراجعة الطلب.';
      } catch (err) {
        alertBox.className = 'alert alert-warning py-2 small fw-bold text-center';
        alertBox.textContent = err.message || 'تعذر الاتصال حالياً. يرجى التواصل مع مدير النظام.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane ms-1"></i> إرسال طلب استعادة كلمة المرور';
      }
    };
  </script>
</body>
</html>
