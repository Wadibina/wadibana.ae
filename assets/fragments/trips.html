<section id="module-trips" class="tab-content hidden space-y-6">
                    <div class="bg-cardbg border border-bordergold p-5 rounded-2xl shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                            <h3 class="text-gold font-extrabold text-sm flex items-center gap-2">
                                <i class="fa-solid fa-bus text-gold"></i> <span id="tripFormTitle">إنشاء / تعديل
                                    رحلة</span>
                            </h3>
                            <button id="cancelEditTripBtn" onclick="resetTripForm()"
                                class="hidden text-xs text-red-400 font-bold bg-red-950/40 border border-red-800 px-2.5 py-1 rounded-lg">إغلاق
                                التعديل</button>
                        </div>
                        <form id="tripForm" onsubmit="handleSaveTrip(event)"
                            class="grid grid-cols-1 sm:grid-cols-6 gap-3">
                            <input type="hidden" id="tripEditId" value="">
                            <div>
                                <label class="block text-xs text-gold mb-1 font-bold">تاريخ الرحلة (اختياري)</label>
                                <input type="date" id="tripDate"
                                    class="w-full bg-darkbg border border-gold rounded-xl p-2.5 text-xs text-zinc-100 outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-xs text-zinc-400 mb-1">خط سير الرحلة / الوجهة *</label>
                                <select id="tripRoute"
                                    class="w-full bg-darkbg border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-200 font-bold">
                                    <option value="من الامارات لليمن">من الامارات لليمن</option>
                                    <option value="من عمان لليمن">من عمان لليمن</option>
                                    <option value="من اليمن للامارات">من اليمن للامارات</option>
                                    <option value="من اليمن لعمان">من اليمن لعمان</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-emerald-400 mb-1 font-bold">ربط باص مسجل (اللوحة /
                                    اللون / السائق)</label>
                                <select id="tripBusSelect" onchange="onBusSelectedForTrip()"
                                    class="w-full bg-darkbg border border-emerald-500 rounded-xl p-2.5 text-xs text-emerald-300 font-bold outline-none">
                                    <option value="">-- اختر من الباصات المسجلة --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-zinc-400 mb-1">بيانات الباص والسائق (تلقائي/يدوي)
                                    *</label>
                                <input type="text" id="tripBusInfo" required
                                    placeholder="مثال: لوحة 123 - أبيض - الكابتن"
                                    class="w-full bg-darkbg border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-200"
                                    value="باص وادي بناء الرئيسي">
                            </div>
                            <div>
                                <label class="block text-xs text-zinc-400 mb-1">حالة الرحلة *</label>
                                <select id="tripStatus"
                                    class="w-full bg-darkbg border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-200 font-bold">
                                    <option value="مجدولة">مجدولة</option>
                                    <option value="غادرت الرحلة">غادرت الرحلة</option>
                                    <option value="مكتملة">مكتملة</option>
                                    <option value="ملغاة">ملغاة</option>
                                </select>
                            </div>
                            <div class="flex items-end">
                                <button type="submit" id="tripSubmitBtn"
                                    class="w-full gold-gradient-bg text-black font-extrabold py-2.5 rounded-xl text-xs shadow">إنشاء
                                    الرحلة</button>
                            </div>
                        </form>
                    </div>

                    <div class="bg-cardbg border border-bordergold p-5 rounded-2xl shadow-xl space-y-4">
                        <h3 class="text-gold font-bold text-sm border-b border-zinc-800 pb-3"><i
                                class="fa-solid fa-list-check ml-1"></i> قائمة الرحلات المجدولة والحالية (تنازلي)</h3>
                        <div class="overflow-x-auto">
                            <table class="custom-table" id="tripsTable">
                                <thead>
                                    <tr>
                                        <th>معرف الرحلة</th>
                                        <th>تاريخ الرحلة</th>
                                        <th>خط السير / الوجهة</th>
                                        <th>الباص (اللوحة / اللون / السائق)</th>
                                        <th>الحالة</th>
                                        <th>التذاكر المرتبطة</th>
                                        <th>إجراءات / غادرت الرحلة / مانفيستو</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </section>
